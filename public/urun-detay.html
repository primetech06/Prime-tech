<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ürün Detayı | Prime-Tech</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        header a {
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        .page {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #555;
            text-decoration: none;
            font-weight: bold;
        }

        .product-detail {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 600px;
        }

        .product-photo {
            background: #f1f1f1;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .product-photo img {
            width: 100%;
            height: 520px;
            object-fit: contain;
            border-radius: 12px;
        }

        .no-photo {
            color: #999;
            font-size: 18px;
            font-weight: bold;
        }

        .product-info {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category {
            color: #777;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .product-info h1 {
            font-size: 46px;
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .description {
            color: #555;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .info-box {
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 22px 0;
            margin-bottom: 30px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
        }

        .whatsapp {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 17px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 17px;
            transition: 0.2s;
        }

        .whatsapp:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .loading,
        .error {
            text-align: center;
            padding: 100px 20px;
            font-size: 20px;
        }

        @media (max-width: 800px) {

            header {
                padding: 18px 20px;
            }

            .product-detail {
                grid-template-columns: 1fr;
            }

            .product-photo {
                min-height: 350px;
            }

            .product-photo img {
                height: 330px;
            }

            .product-info {
                padding: 35px 25px;
            }

            .product-info h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">PRIME-TECH</div>

    <a href="/">Ana Sayfaya Dön</a>
</header>


<main class="page">

    <a href="/" class="back">← Ürünlere Dön</a>

    <div id="content">

        <div class="loading">
            Ürün bilgileri yükleniyor...
        </div>

    </div>

</main>


<script>

const WHATSAPP_NUMBER = "905350745203";

async function loadProduct() {

    const params = new URLSearchParams(window.location.search);

    const id = params.get("id");

    if (!id) {
        showError("Ürün bulunamadı.");
        return;
    }

    try {

        const response = await fetch("/api/products");

        if (!response.ok) {
            throw new Error("Ürünler alınamadı.");
        }

        const products = await response.json();

        const product = products.find(
            item => String(item.id) === String(id)
        );

        if (!product) {
            showError("Bu ürün artık mevcut değil.");
            return;
        }

        document.title = product.name + " | Prime-Tech";

        const image = product.image
            ? `<img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}">`
            : `<div class="no-photo">FOTOĞRAF YOK</div>`;

        const productUrl =
            window.location.origin +
            "/urun-detay.html?id=" +
            encodeURIComponent(product.id);

        const message =
            `Merhaba Prime-Tech, "${product.name}" ürünü hakkında bilgi almak istiyorum.\n\n` +
            `Ürün bağlantısı: ${productUrl}`;

        const whatsappUrl =
            "https://wa.me/" +
            WHATSAPP_NUMBER +
            "?text=" +
            encodeURIComponent(message);

        document.getElementById("content").innerHTML = `

            <div class="product-detail">

                <div class="product-photo">
                    ${image}
                </div>

                <div class="product-info">

                    <div class="category">
                        ${escapeHtml(product.category || "Diğer")}
                    </div>

                    <h1>
                        ${escapeHtml(product.name)}
                    </h1>

                    <p class="description">
                        ${escapeHtml(
                            product.description ||
                            "Bu ürün hakkında detaylı bilgi almak için bizimle iletişime geçebilirsiniz."
                        )}
                    </p>

                    <div class="info-box">

                        <strong>Ürün hakkında daha fazla bilgi mi istiyorsunuz?</strong>

                        <span>
                            Detaylı bilgi, stok durumu ve diğer sorularınız için
                            WhatsApp üzerinden bize ulaşabilirsiniz.
                        </span>

                    </div>

                    <a
                        href="${whatsappUrl}"
                        target="_blank"
                        class="whatsapp"
                    >
                        💬 WhatsApp'tan Bilgi Al
                    </a>

                </div>

            </div>

        `;

    } catch (error) {

        console.error(error);

        showError("Ürün bilgileri yüklenirken bir hata oluştu.");

    }
}


function showError(message) {

    document.getElementById("content").innerHTML = `
        <div class="error">
            ${message}
        </div>
    `;

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadProduct();

</script>

</body>
</html>
